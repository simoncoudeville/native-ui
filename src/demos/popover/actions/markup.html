<div class="row">
  <button command="show-popover" commandfor="panel">Show</button>
  <button command="hide-popover" commandfor="panel">Hide</button>
  <button command="toggle-popover" commandfor="panel">Toggle</button>
</div>

<!-- manual popovers ignore light dismiss: clicking outside or pressing
     Escape leaves them open, and several can be open at once. -->
<div popover="manual" id="panel" class="popover">
  <p><code>popover="manual"</code>: dismissed only by a button that targets it.</p>
  <button command="hide-popover" commandfor="panel">Dismiss</button>
</div>
