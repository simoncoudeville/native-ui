<div class="row">
  <button popovertarget="panel" popovertargetaction="show">Show</button>
  <button popovertarget="panel" popovertargetaction="hide">Hide</button>
  <button popovertarget="panel" popovertargetaction="toggle">Toggle</button>
</div>

<!-- manual popovers ignore light dismiss: clicking outside or pressing
     Escape leaves them open, and several can be open at once. -->
<div popover="manual" id="panel">
  <p><code>popover="manual"</code> — dismissed only by a button that targets it.</p>
  <button popovertarget="panel" popovertargetaction="hide">Dismiss</button>
</div>
