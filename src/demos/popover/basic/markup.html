<button popovertarget="details-card">What is a popover?</button>

<!-- popover="auto" is the default: light-dismissable, and only one
     auto popover in a tree can be open at a time. -->
<div popover id="details-card" class="popover">
  <h3>Auto popover</h3>
  <p>
    Click anywhere outside, or press Escape, and it closes itself. No
    click-outside listener, no z-index, no positioning library.
  </p>
</div>
