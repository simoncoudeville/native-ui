<div class="row">
  <button command="show-modal" commandfor="drawer">Drawer</button>
  <button command="show-modal" commandfor="sheet">Bottom sheet</button>
  <button command="show-modal" commandfor="cover" class="primary">Full screen</button>
</div>

<dialog id="drawer" class="dialog drawer" closedby="any">
  <h3>Filters</h3>
  <p>Pinned to the inline-end edge, running the full height of the viewport.</p>
  <button command="close" commandfor="drawer">Close</button>
</dialog>

<dialog id="sheet" class="dialog sheet" closedby="any">
  <h3>Share</h3>
  <p>Edge to edge along the bottom, sized by its own content.</p>
  <button command="close" commandfor="sheet">Close</button>
</dialog>

<dialog id="cover" class="dialog cover" closedby="any">
  <div class="inner">
    <h2>This fills the whole viewport.</h2>
    <p>
      The dialog is nested inside a bordered demo card, and the card cannot
      clip it.
    </p>
    <button command="close" commandfor="cover">Close</button>
  </div>
</dialog>
