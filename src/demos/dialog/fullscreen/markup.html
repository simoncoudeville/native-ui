<button command="show-modal" commandfor="immersive" class="primary">
  Open full-screen dialog
</button>

<dialog id="immersive" closedby="any">
  <div class="inner">
    <p class="eyebrow">Top layer</p>
    <h2>This fills the whole viewport.</h2>
    <p>
      The dialog is nested inside a bordered demo card, but it escapes it
      entirely — no clipping, no stacking-context trap, no z-index. Modal
      dialogs are promoted to the browser's top layer, which sits above the
      whole document.
    </p>
    <button command="close" commandfor="immersive">Close</button>
  </div>
</dialog>
