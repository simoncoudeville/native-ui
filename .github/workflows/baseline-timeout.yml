name: Baseline PR timeout

# A PR waiting for review only helps while there is attention to give it.
# This merges an untouched data PR after a grace period so a busy fortnight
# can't quietly park the site on stale support data.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      grace_days:
        description: 'Override the grace period for this run (days)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Find data PRs past the grace period
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository variable. Set to 0 to require a manual merge always.
          GRACE_DAYS: ${{ inputs.grace_days || vars.AUTO_MERGE_AFTER_DAYS || '7' }}
        run: |
          set -euo pipefail

          if [ "$GRACE_DAYS" = "0" ]; then
            echo "AUTO_MERGE_AFTER_DAYS=0, timeout merging disabled."
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # "N days ago" rather than "-N days" so a negative override puts the
          # cutoff in the future, which is how the path gets exercised on demand.
          cutoff=$(date -u -d "${GRACE_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Selecting labelled data PRs created before $cutoff"

          # Restricted to the label this repo's own refresh job applies, so it
          # can never touch a human's pull request.
          prs=$(gh pr list \
            --label baseline-data \
            --state open \
            --json number,createdAt,isDraft \
            --jq "[.[] | select(.createdAt < \"$cutoff\") | select(.isDraft == false) | .number] | join(\" \")")

          echo "Matched: ${prs:-none}"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

      - name: Verify and merge
        if: steps.find.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS: ${{ steps.find.outputs.prs }}
          GRACE_DAYS: ${{ inputs.grace_days || vars.AUTO_MERGE_AFTER_DAYS || '7' }}
        run: |
          set -euo pipefail

          for pr in $PRS; do
            echo "::group::PR #$pr"

            # A PR opened with GITHUB_TOKEN does not trigger workflow runs, so
            # no CI has ever run against it and there is nothing for --auto to
            # wait on. Merging on a timer without checking would ship whatever
            # the refresh job produced, unverified. So verify it here instead.
            gh pr checkout "$pr"
            npm ci
            npm run build
            npm run baseline:check

            echo "Build and snapshot check passed. Merging."
            head=$(gh pr view "$pr" --json headRefName --jq .headRefName)
            gh pr merge "$pr" --squash \
              --subject "chore: refresh Baseline data (auto-merged after ${GRACE_DAYS}d)"

            # Delete the branch over the API rather than with `gh pr merge
            # --delete-branch`, which also tries to switch the local clone to the
            # base branch, a branch the shallow checkout has never fetched.
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${head}" \
              || echo "Branch ${head} already gone."
            echo "::endgroup::"
          done
