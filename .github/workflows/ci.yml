name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Fails when the committed snapshot no longer matches the data the build
      # computed, so a data PR can't merge without its snapshot updated.
      - name: Check Baseline snapshot
        run: npm run baseline:check
